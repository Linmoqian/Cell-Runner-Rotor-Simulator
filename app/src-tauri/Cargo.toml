[package]
name = "cell-runner-rotor-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "cell_runner_rotor_desktop"
crate-type = ["cdylib", "rlib", "staticlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2.11.5"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
